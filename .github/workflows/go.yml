name: Go

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v6
        - name: Setup Go
          uses: actions/setup-go@v5
          with:
            go-version-file: apps/api/go.mod
        - name: Display go version
          run: go version
        - name: Initialize Go workspace
          run: go work init ./apps/api ./internal/shared ./apps/utils ./apps/relay
        - name: Build
          run: |
            (cd internal/shared && go build ./...)
            (cd apps/api && go build ./...)
            (cd apps/utils && go build ./...)
            (cd apps/relay && go build ./...)
        - name: Test
          run: |
            (cd internal/shared && go test ./...)
            (cd apps/api && go test ./...)
            (cd apps/utils && go test ./...)
            (cd apps/relay && go test ./...)
    